name: Update coding activity

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Runs twice daily, at 00:00 and 12:00 UTC.
    - cron: "0 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: coding-activity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate dashboard
        run: npm run build
        env:
          WAKATIME_ACCESS_TOKEN: ${{ secrets.WAKATIME_ACCESS_TOKEN }}
          # Set this repository variable to your preferred IANA timezone,
          # e.g. Europe/Berlin or Asia/Tehran.
          WAKATIME_TIMEZONE: ${{ vars.WAKATIME_TIMEZONE || 'UTC' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/coding-activity.svg

          if git diff --cached --quiet; then
            echo "No coding activity changes to commit."
            exit 0
          fi

          git commit -m "chore: update coding activity dashboard"
          git push
